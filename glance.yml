theme:
  background-color: 0 0 16
  primary-color: 43 59 81
  positive-color: 61 66 44
  negative-color: 6 96 59

pages:
  - name: Startpage
    hide-desktop-navigation: false
    center-vertically: true
    columns:

      - size: small
        widgets:
          - type: custom-api
            title: PROXMOX-VE NODES
            title-url: http://192.168.1.101:8006
            cache: 1m
            url: http://192.168.1.101:8006/api2/json/nodes
            allow-insecure: true
            headers:
              Accept: application/json
              Authorization: PVEAPIToken=api@pam!glance=bf7eb465-35c2-44ba-8d77-c79922a04456
            options:
              uptime-mode: duration  # relative | duration
              collapse-after: 5
            template: | #html
              {{ $uptimeMode := .Options.StringOr "uptime-mode" "relative" }}
              {{ $collapseAfter := .Options.IntOr "collapseAfter" 3 }}
              <ul class="list list-gap-14 collapsible-container" data-collapse-after="{{ $collapseAfter }}">
                {{ range .JSON.Array "data" }}
                <li>
                  <div class="server" proxmox-node="{{ .String "node" }}">
                    <div class="server-info">
                        <div class="server-details">
                            <div class="server-name color-highlight size-h3 text-truncate">
                              {{ .String "node" }}
                            </div>
                            <div>
                                {{ if eq $.Response.StatusCode 200 }}
                                  <div data-popover-type="html">
                                    <div data-popover-html>
                                      {{ if eq $uptimeMode "relative" }}
                                        <span {{ now.Add (duration (concat "-" (.String "uptime") "s")) | toRelativeTime }}></span>
                                      {{ else }}
                                        <span>{{ duration (concat (.String "uptime") "s") }}</span>
                                      {{ end }}
                                    </div>
                                    <div>
                                      {{ if ne $uptimeMode "relative" }}
                                        <span {{ now.Add (duration (concat "-" (.String "uptime") "s")) | toRelativeTime }}></span>
                                      {{ else }}
                                        <span>{{ duration (concat (.String "uptime") "s") }}</span>
                                      {{ end }}
                                    </div>
                                  </div>
                                {{ else }}
                                  {{ .String "status" }}
                                {{ end }}
                            </div>
                        </div>
                        <svg class="server-icon" stroke="var(--color-{{ if eq (.String "status") "online" }}positive{{ else }}negative{{ end }})" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 17.25v-.228a4.5 4.5 0 0 0-.12-1.03l-2.268-9.64a3.375 3.375 0 0 0-3.285-2.602H7.923a3.375 3.375 0 0 0-3.285 2.602l-2.268 9.64a4.5 4.5 0 0 0-.12 1.03v.228m19.5 0a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3m19.5 0a3 3 0 0 0-3-3H5.25a3 3 0 0 0-3 3m16.5 0h.008v.008h-.008v-.008Zm-3 0h.008v.008h-.008v-.008Z" />
                        </svg>
                    </div>
                    <div class="server-stats">
                        <div class="flex-1">
                            <div class="flex items-end size-h5">
                                <div>CPU</div>
                                {{ if (ge (mul (.Float "cpu") 100 | toInt ) 80) }}
                                <svg class="server-spicy-cpu-icon" fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" >
                                    <path fill-rule="evenodd" d="M8.074.945A4.993 4.993 0 0 0 6 5v.032c.004.6.114 1.176.311 1.709.16.428-.204.91-.61.7a5.023 5.023 0 0 1-1.868-1.677c-.202-.304-.648-.363-.848-.058a6 6 0 1 0 8.017-1.901l-.004-.007a4.98 4.98 0 0 1-2.18-2.574c-.116-.31-.477-.472-.744-.28Zm.78 6.178a3.001 3.001 0 1 1-3.473 4.341c-.205-.365.215-.694.62-.59a4.008 4.008 0 0 0 1.873.03c.288-.065.413-.386.321-.666A3.997 3.997 0 0 1 8 8.999c0-.585.126-1.14.351-1.641a.42.42 0 0 1 .503-.235Z" clip-rule="evenodd" />
                                </svg>
                                {{ end }}
                                <div class="color-highlight margin-left-auto text-very-compact">
                                  <span>{{ mul (.Float "cpu") 100 | toInt | formatNumber }}</span> <span class="color-base">%</span>
                                </div>
                            </div>
                            <div data-popover-type="html">
                                <div data-popover-html>
                                  <div>
                                    <div class="flex">
                                      <div class="size-h5">LOAD</div>
                                      <div class="value-separator"></div>
                                      <div class="color-highlight text-very-compact"><span>{{ mul (.Float "cpu") 100 | toInt | formatNumber }}</span> <span class="color-base size-h5">%</span></div>
                                    </div>
                                    <div class="flex margin-top-3">
                                      <div class="size-h5">CORES</div>
                                      <div class="value-separator"></div>
                                      <div class="color-highlight text-very-compact">{{ .Int "maxcpu" }}</div>
                                    </div>
                                  </div>
                                </div>
                                <div class="progress-bar progress-bar-combined">
                                    <div class="progress-value{{ if ge (mul (.Float "cpu") 100 | toInt) 80 }} progress-value-notice{{ end }}" style="--percent: {{ mul (.Float "cpu") 100 | toInt | formatNumber }}"></div>
                                </div>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-end size-h5">
                                <div>RAM</div>
                                <div class="color-highlight text-very-compact">
                                  <span>{{ mul (div (.Int "mem" | toFloat) (.Int "maxmem" | toFloat)) 100 | toInt }}</span> <span class="color-base">%</span>
                                </div>
                            </div>
                            <div data-popover-type="html">
                                <div data-popover-html>
                                  <div>
                                    <div class="flex">
                                        <div class="size-h5">RAM</div>
                                        <div class="value-separator"></div>
                                        <div class="color-highlight text-very-compact">
                                          <span>{{ div (.Int "mem" | toFloat) 1073741824 | toInt | formatNumber }}GB</span>
                                          <span class="color-base size-h5">/</span>
                                          <span>{{ div (.Int "maxmem" | toFloat) 1073741824 | toInt | formatNumber }}GB</span>
                                        </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="progress-bar progress-bar-combined">
                                  <div class="progress-value{{ if ge (mul (div (.Int "mem" | toFloat) (.Int "maxmem" | toFloat)) 100 | toInt) 80 }} progress-value-notice{{ end }}" style="--percent: {{ mul (div (.Int "mem" | toFloat) (.Int "maxmem" | toFloat)) 100 | toInt }}"></div>
                                </div>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-end size-h5">
                                <div>DISK</div>
                                <div class="color-highlight text-very-compact">
                                  <span>{{ mul (div (.Int "disk" | toFloat) (.Int "maxdisk" | toFloat)) 100 | toInt }}</span> <span class="color-base">%</span>
                                </div>
                            </div>
                            <div data-popover-type="html">
                              <div data-popover-html>
                                <div>
                                  <div class="flex">
                                      <div class="size-h5">DISK</div>
                                      <div class="value-separator"></div>
                                      <div class="color-highlight text-very-compact">
                                          <span>{{ div (.Int "disk" | toFloat) 1073741824 | toInt | formatNumber }}GB</span>
                                          <span class="color-base size-h5">/</span>
                                          <span>{{ div (.Int "maxdisk" | toFloat) 1073741824 | toInt | formatNumber }}GB</span>
                                      </div>
                                  </div>
                                </div>
                              </div>
                              <div class="progress-bar progress-bar-combined">
                                <div class="progress-value{{ if ge (mul (div (.Int "disk" | toFloat) (.Int "maxdisk" | toFloat)) 100 | toInt) 80 }} progress-value-notice{{ end }}" style="--percent: {{ mul (div (.Int "disk" | toFloat) (.Int "maxdisk" | toFloat)) 100 | toInt }}"></div>
                              </div>
                            </div>
                        </div>
                    </div>
                  </div>
                </li>
                {{ end }}
              </ul>

      - size: full
        widgets:
          - type: search
            autofocus: true
            search-engine: google
            new-tab: true
            bangs:
              - title: YouTube
                shortcut: "!yt"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: Github
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}&type=repositories

          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Proxmox
                url: http://192.168.1.101:8006
                check-url: http://192.168.1.101:8006
                allow-insecure: true
                icon: di:proxmox
              - title: TrueNAS
                url: http://192.168.1.234
                check-url: http://192.168.1.234
                allow-insecure: true
                icon: di:truenas
              - title: Jellyfin
                url: http://192.168.1.236:8096
                check-url: http://192.168.1.236:8096
                icon: di:jellyfin
                alt-status-codes:
                  - 401
                  - 403
              - title: Audiobookshelf
                url: http://192.168.1.203:13378
                check-url: http://192.168.1.203:13378
                icon: di:audiobookshelf
              - title: Uptime Kuma
                url: http://192.168.1.229:3001
                check-url: http://192.168.1.229:3001
                icon: di:uptime-kuma
              - title: Vaultwarden
                url: https://vaultwarden.tailfef5f3.ts.net/#/vault
                check-url: http://192.168.1.231:8000
                icon: di:vaultwarden-light
              - title: Tailscale
                url: https://console.tailscale.com/admin/machines?refreshed=true
                check-url: https://console.tailscale.com/admin/machines?refreshed=true
                icon: di:tailscale-light
              - title: Playit
                url: https://playit.gg/account/agents
                check-url: https://playit.gg/account/agents
                icon: sh:playit-gg
              - title: AirVPN
                url: https://airvpn.org/client/
                check-url: https://airvpn.org/client/
                icon: di:airvpn

          - type: monitor
            cache: 1m
            title: Servarr
            sites:
              - title: Seerr
                url: http://192.168.1.236:5055
                check-url: http://192.168.1.236:5055
                icon: di:seerr
              - title: Radarr
                url: http://192.168.1.236:7878
                check-url: http://192.168.1.236:7878
                icon: di:radarr
              - title: Sonarr
                url: http://192.168.1.236:8989
                check-url: http://192.168.1.236:8989
                icon: di:sonarr
              - title: Prowlarr
                url: http://192.168.1.236:9696
                check-url: http://192.168.1.236:9696
                icon: di:prowlarr
              - title: qBittorrent
                url: http://192.168.1.236:8080
                check-url: http://192.168.1.236:8080
                icon: di:qbittorrent
              - title: NZBGet
                url: http://192.168.1.236:6789
                check-url: http://192.168.1.236:6789
                icon: di:nzbget
                alt-status-codes:
                  - 401
                  - 403

          - type: monitor
            cache: 1m
            title: Audiobooksarr
            sites:
              - title: AudioBookRequest
                url: http://192.168.1.203:8000
                check-url: http://192.168.1.203:8000
                icon: sh:audiobookrequest-light

      - size: small
        widgets:
          - type: repository
            repository: Aaron3303/Homelab
            pull-requests-limit: 5
            issues-limit: 3
            commits-limit: 3
          - type: custom-api
            title: Uptime Kuma
            title-url: http://192.168.1.229:3001
            url: http://192.168.1.229:3001/api/status-page/homelab
            subrequests:
              heartbeats:
                url: http://192.168.1.229:3001/api/status-page/heartbeat/homelab
            cache: 10m
            template: |
              {{ $hb := .Subrequest "heartbeats" }}

              {{ if not (.JSON.Exists "publicGroupList") }}
              <p class="color-negative">Error reading response</p>
              {{ else if eq (len (.JSON.Array "publicGroupList")) 0 }}
              <p>No monitors found</p>
              {{ else }}

              <ul class="dynamic-columns list-gap-8">
                {{ range .JSON.Array "publicGroupList" }}
                {{ range .Array "monitorList" }}
                {{ $id := .String "id" }}
                {{ $hbArray := $hb.JSON.Array (print "heartbeatList." $id) }}
                <div class="flex items-center gap-12">
                  <a class="size-title-dynamic color-highlight text-truncate block grow" href="http://192.168.1.229:3001/dashboard/{{ $id }}"
                    target="_blank" rel="noreferrer">
                    {{ .String "name" }} </a>

                  {{ if gt (len $hbArray) 0 }}
                    {{ $latest := index $hbArray (sub (len $hbArray) 1) }}
                    {{ if eq ($latest.Int "status") 1 }}
                    <div>{{ $latest.Int "ping" }}ms</div>
                    <div class="monitor-site-status-icon-compact" title="OK">
                      <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                          d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
                          clip-rule="evenodd"></path>
                      </svg>
                    </div>
                    {{ else }}
                    <div><span class="color-negative">DOWN</span></div>
                    <div class="monitor-site-status-icon-compact" title="{{ if $latest.Exists "msg" }}{{ $latest.String "msg" }}{{ else
                      }}Error{{ end }}">
                      <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                          d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                          clip-rule="evenodd"></path>
                      </svg>
                    </div>
                    {{ end }}
                  {{ else }}
                    <div><span class="color-negative">No data</span></div>
                    <div class="monitor-site-status-icon-compact" title="No data available">
                      <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-2a6 6 0 1 0 0-12 6 6 0 0 0 0 12zm-.75-8a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V8zm.75 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                      </svg>
                    </div>
                  {{ end }}
                </div>
                {{ end }}
                {{ end }}
              </ul>
              {{ end }}

          - type: custom-api
            title: Minecraft
            url: https://api.mcstatus.io/v2/status/java/fixed-install.gl.joinmc.link
            cache: 30s
            template: |
              <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:40px; height:40px; flex-shrink:0;  border-radius:4px; display:flex; justify-content:center; align-items:center; overflow:hidden;">
                  {{ if .JSON.Bool "online" }}
                    <img src="{{ .JSON.String "icon" | safeURL }}" width="64" height="64" style="object-fit:contain;">
                  {{ else }}
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" style="width:32px; height:32px; opacity:0.5;">
                      <path fill-rule="evenodd" d="M1 5.25A2.25 2.25 0 0 1 3.25 3h13.5A2.25 2.25 0 0 1 19 5.25v9.5A2.25 2.25 0 0 1 16.75 17H3.25A2.25 2.25 0 0 1 1 14.75v-9.5Zm1.5 5.81v3.69c0 .414.336.75.75.75h13.5a.75.75 0 0 0 .75-.75v-2.69l-2.22-2.219a.75.75 0 0 0-1.06 0l-1.91 1.909.47.47a.75.75 0 1 1-1.06 1.06L6.53 8.091a.75.75 0 0 0-1.06 0l-2.97 2.97ZM12 7a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z" clip-rule="evenodd" />
                    </svg>
                  {{ end }}
                </div>

                <div style="flex-grow:1; min-width:0;">
                  <a class="size-h4 block text-truncate color-highlight">
                    {{ .JSON.String "host" }}
                    {{ if .JSON.Bool "online" }}
                    <span
                      style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-positive); display: inline-block; vertical-align: middle;"
                      data-popover-type="text"
                      data-popover-text="Online"
                    ></span>
                    {{ else }}
                    <span
                      style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-negative); display: inline-block; vertical-align: middle;"
                      data-popover-type="text"
                      data-popover-text="Offline"
                    ></span>
                    {{ end }}
                  </a>

                  <ul class="list-horizontal-text">
                    <li>
                      {{ if .JSON.Bool "online" }}
                      <span>{{ .JSON.String "version.name_clean" }}</span>
                      {{ else }}
                      <span>Offline</span>
                      {{ end }}
                    </li>
                    {{ if .JSON.Bool "online" }}
                    <li data-popover-type="html">
                      <div data-popover-html>
                        {{ range .JSON.Array "players.list" }}{{ .String "name_clean" }}<br>{{ end }}
                      </div>
                      <p style="display:inline-flex;align-items:center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6" style="height:1em;vertical-align:middle;margin-right:0.5em;">
                          <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
                        </svg>
                        {{ .JSON.Int "players.online" | formatNumber }}/{{ .JSON.Int "players.max" | formatNumber }} players
                      </p>
                    </li>
                    {{ else }}
                    <li>
                      <p style="display:inline-flex;align-items:center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6" style="height:1em;vertical-align:middle;margin-right:0.5em;opacity:0.5;">
                          <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
                        </svg>
                        0 players
                      </p>
                    </li>
                    {{ end }}
                  </ul>
                </div>
              </div>

  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
    # hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: rss
            limit: 10
            collapse-after: 3
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                limit: 4
              - url: https://ciechanow.ski/atom.xml
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://samwho.dev/rss.xml
              - url: https://ishadeed.com/feed.xml
                title: Ahmad Shadeed

          - type: twitch-channels
            channels:
              - theprimeagen
              - j_blow
              - giantwaffle
              - cohhcarnage
              - christitustech
              - EJ_SA

      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
              - type: lobsters

          - type: videos
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UCsBjURrPoezykLs9EqgamOA # Fireship
              - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
              - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

          - type: group
            widgets:
              - type: reddit
                subreddit: technology
                show-thumbnails: true
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true

      - size: small
        widgets:
          - type: weather
            location: London, United Kingdom
            units: metric # alternatively "imperial"
            hour-format: 12h # alternatively "24h"
            # Optionally hide the location from being displayed in the widget
            # hide-location: true

          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: NVDA
                name: NVIDIA
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft

          - type: releases
            cache: 1d
            # Without authentication the Github API allows for up to 60 requests per hour. You can create a
            # read-only token from your Github account settings and use it here to increase the limit.
            # token: ...
            repositories:
              - glanceapp/glance
              - go-gitea/gitea
              - immich-app/immich
              - syncthing/syncthing

